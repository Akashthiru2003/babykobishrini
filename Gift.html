<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Gift Box</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#5757a9,#ff4d6d);
    overflow:hidden;
}

/* Floating Hearts */

.hearts span{
    position:absolute;
    bottom:-50px;
    color:#dd0808;
    font-size:20px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

.hearts span:nth-child(1){left:10%; animation-duration:7s;}
.hearts span:nth-child(2){left:25%; animation-duration:10s;}
.hearts span:nth-child(3){left:50%; animation-duration:8s;}
.hearts span:nth-child(4){left:75%; animation-duration:6s;}
.hearts span:nth-child(5){left:90%; animation-duration:9s;}

/* Gift Box */

.container{
    perspective:1000px;
}

.gift{
    position:relative;
    width:260px;
    height:260px;
    transform-style:preserve-3d;
    transition:1s;
    cursor:pointer;
}

.box{
    width:100%;
    height:100%;
    background:#ff1744;
    border-radius:20px;
    position:relative;
    box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

/* Ribbon */

.ribbon-v{
    .ribbon-v{
    position:absolute;
    width:50px;
    height:100%;
    background:#ffd700;
    left:105px;
}
}

.ribbon-h{
    .ribbon-h{
    position:absolute;
    width:100%;
    height:50px;
    background:#ffd700;
    top:105px;
}
}

/* Lid */

.lid{
    position:absolute;
    width:280px;
    height:70px;
    background:#ff0033;
    top:-55px;
    left:-10px;
    border-radius:20px;
    transform-origin:left;
    transition:1.5s;
    z-index:5;
}

.lid::before{
    content:"";
    position:absolute;
    width:50px;
    height:70px;
    background:white;
    left:115px;
}

/* Surprise */

.surprise{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1.5s;
    color:white;
    text-align:center;
    padding:15px;
}

.surprise h1{
    font-size:24px;
    margin-bottom:10px;
}

.surprise p{
    font-size:15px;
    margin:5px 0;
}

.choco{
    font-size:45px;
    margin-top:10px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Open Animation */

.open .lid{
    transform:rotate(-130deg);
}

.open .surprise{
    opacity:1;
    transform:translateY(-10px);
}

/* Button */

.note{
    position:absolute;
    top:80%;
    color:rgb(241, 234, 234);
    font-size:18px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

</style>
</head>

<body>

<div class="hearts">
    <span>❤</span>
    <span>💖</span>
    <span>💕</span>
    <span>💘</span>
    <span>💝</span>
    <span>🫶</span>
    <span>💞</span>
    <span>💗</span>
    <span>💓</span>
    <span>🫂</span>
</div>

<div class="container">

    <div class="gift" id="gift" onclick="openGift()">

        <div class="lid"></div>

        <div class="box">
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>

            <div class="surprise">
                <h1>For My Thaen </h1>

                <p>💖 You make my life happier💖</p>
                <p>😊Thank you for every memory</p>
                <p>🌟 Our bond is forever🌟</p>
                <p>🎁 You are very special to me🎁</p>

                <div class="choco">
                    🍫 🍫 🍫
                </div>
            </div>

        </div>
    </div>

</div>

<div class="note">
   <center> Click The Gift 🎁 <br> 
     ❤🫶🫂<br >
        <h3>“Yesterday is the past, tomorrow is the future, but today is a gift. That’s why it’s called the present.”😊</h3></center>


    
</div>

<script>

function openGift(){
    document.getElementById("gift").classList.toggle("open");
}

</script>
</body>
</html>
